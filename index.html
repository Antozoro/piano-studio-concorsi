<meta name="theme-color" content="#2B2B28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --paper: #E7E2D6;
    --paper-light: #F1EDE2;
    --ink: #2B2B28;
    --ink-soft: #5C574C;
    --line: #C9C2AE;
    --stamp: #B23B2E;
    --comune: #A8792B;
    --pecs: #2C4A6E;
    --pecs2: #4A7BAD;
    --dtd2: #1F6F5C;
    --informatico: #6B6558;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px 16px 60px;
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
  }
  .sheet{
    max-width: 720px;
    margin: 0 auto;
    background: var(--paper-light);
    border: 1px solid var(--line);
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(43,43,40,0.08);
  }
  .header{
    padding: 22px 26px 16px;
    border-bottom: 2px solid var(--focus-accent, var(--ink));
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .header h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    letter-spacing: 0.3px;
    margin: 0 0 4px;
  }
  .header .sub{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.4px;
  }
  .protocollo{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align:right;
    line-height: 1.5;
    white-space: nowrap;
    padding-top: 2px;
  }
  .streak-hero{
    display:flex;
    align-items:center;
    gap: 18px;
    padding: 20px 26px;
    border-bottom: 2px solid var(--focus-accent, var(--ink));
    background: var(--paper-light);
    position: relative;
    overflow: hidden;
  }
  .streak-flame{
    font-size: 34px;
    line-height: 1;
    flex-shrink: 0;
    transition: font-size 0.2s ease;

function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isoWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const diff = (date - firstThursday) / 86400000;
  return 1 + Math.round(diff/7);
}
function dayCategory(d){
  const day = d.getDay();
  if(day===1) return 'comune';
  if(day===2) return 'pecspre';
  if(day===3) return 'dtd2';
  if(day===4) return 'pecspre';
  if(day===5) return 'dtd2';
  if(day===6) return (isoWeek(d) % 2 === 0) ? 'pecspre' : 'dtd2';
  return 'informatico'; // Sunday
}
// Se è attiva la modalità focus, sovrascrive la rotazione automatica per QUALSIASI giorno
function effectiveDayCategory(d){
  return state.focusMode || dayCategory(d);
}
async function setFocusMode(catOrNull){
  state.focusMode = catOrNull;
  await saveState();
  render();
}
function mondayOf(d){
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  const m = new Date(d);
  m.setDate(d.getDate()+diff);
  return m;
}

function getAllTopicsList(){
  const list = [];
  ['comune','pecspre','pecsscritto','dtd2','informatico'].forEach(cat=>{
    const catData = CATS[cat];
    catData.topics.forEach(topic=>{
      const { topicClean } = computeModeInfo(topic, catData);
      list.push({ cat, catLabel: catData.tag, topicClean });
    });
  });
  return list;
}

function computeModeInfo(topic, catData){
  let modeClass, modeLabel, modeHint, topicClean, resourceUrl = null;
  if (topic.includes('(quiz Concorsando)')) {
    modeClass = 'mode-quiz';
    modeLabel = 'ESERCITAZIONE · QUIZ SU CONCORSANDO';
    topicClean = topic.replace(' (quiz Concorsando)', '');
    modeHint = `Vai su Concorsando, seleziona solo questa materia (non "Tutte") e fai una sessione di quiz mirata. Rivedi ogni errore prima di chiudere — è lì che si impara, non nel punteggio.`;
  } else if (topic.includes('(manuale, non su Concorsando')) {
    modeClass = 'mode-manual';
    modeLabel = 'LETTURA · NON SU CONCORSANDO';
    topicClean = topic.replace(/ \(manuale, non su Concorsando[^)]*\)/, '');
    resourceUrl = RESOURCE_LINKS[topicClean] || null;
    modeHint = resourceUrl
      ? `Questa materia non ha quiz su Concorsando — è testo da leggere e capire. Il PDF con i contenuti mirati è pronto qui sotto.`
      : `Questa materia non ha quiz su Concorsando — è testo da leggere e capire, non da "fare". Chiedimi le fonti quando arrivi qui e te le trovo.`;
  } else if (topic.includes('(comune a')) {
    modeClass = 'mode-quiz';
    modeLabel = 'ESERCITAZIONE · QUIZ SU CONCORSANDO';
    topicClean = topic.replace(/ \(comune a[^)]*\)/, '');
    modeHint = `Materia comune a più concorsi — quiz su Concorsando, ma i punti guadagnati valgono per più prove insieme.`;
  } else {
    modeClass = 'mode-quiz';
    modeLabel = 'SESSIONE DI STUDIO';
    topicClean = topic;
    modeHint = `${catData.label} — circa 30–60 minuti.`;
  }
  return { modeClass, modeLabel, modeHint, topicClean, resourceUrl };
}

function calculateStreak(){
  let streak = 0;
  let d = new Date();
  const todayKey = dateKey(d);
  if(!state.log[todayKey]){
    d.setDate(d.getDate()-1);
  }
  while(true){
    const k = dateKey(d);
    if(state.log[k]){
      streak++;
      d.setDate(d.getDate()-1);
    } else break;
  }
  return streak;
}

function getStreakTier(streak){
  if(streak <= 0) return 'none';

  if(streak < 7) return 'small';

  if(streak < 100) return 'large';

function monthGridCells(viewDate){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startWeekday = (firstOfMonth.getDay()+6)%7; // lunedì = 0
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));
  return cells;
}

const MONTH_NAMES = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function topicKeyOf(topic){
  if(topic.includes('(quiz Concorsando)')) return topic.replace(' (quiz Concorsando)', '');
  if(topic.includes('(manuale, non su Concorsando')) return topic.replace(/ \(manuale, non su Concorsando[^)]*\)/, '');
  if(topic.includes('(comune a')) return topic.replace(/ \(comune a[^)]*\)/, '');
  return topic;
}

function getCurrentTopicClean(cat){
  const catData = CATS[cat];
  const idx = state.indices[cat] % catData.topics.length;
  const topic = catData.topics[idx];
  return computeModeInfo(topic, catData).topicClean;
}

function categoryScoreStats(cat){
  const cd = CATS[cat];
  let totalPct = 0, count = 0;
  cd.topics.forEach(t=>{
    const key = topicKeyOf(t);
    const arr = state.scores[key];
    if(arr && arr.length){
      const last = arr[arr.length-1];
      if(last.total>0){ totalPct += (last.correct/last.total)*100; count++; }
    }
  });
  if(count===0) return null;
  return { avg: Math.round(totalPct/count), count };
}

// Criterio "padroneggiato": almeno 3 sessioni salvate, almeno 100 domande complessive nel campione,
// e le ultime 3 sessioni consecutive tutte all'80% o più — non basta un singolo buon risultato isolato.
function isMastered(topicClean){
  const hist = state.scores[topicClean];
  if(!hist || hist.length < 3) return false;
  const sumTotal = hist.reduce((s,e)=> s + (e.total||0), 0);
  if(sumTotal < 100) return false;
  const lastThree = hist.slice(-3);
  return lastThree.every(e => e.total > 0 && (e.correct/e.total) >= 0.8);
}

function categoryMasteredStats(cat){
  const cd = CATS[cat];
  let masteredCount = 0;
  cd.topics.forEach(t=>{
    const key = topicKeyOf(t);
    if(isMastered(key)) masteredCount++;
  });
  return { mastered: masteredCount, total: cd.topics.length };
}

function categoryCustomCount(cat){
  let count = 0;
  Object.values(state.customLog).forEach(dayEntries=>{
    dayEntries.forEach(e=>{ if(e.cat === cat) count++; });
  });
  return count;
}

// Statistiche di una singola materia: percentuale media su tutte le sessioni salvate
// (più stabile del solo ultimo risultato), trend rispetto alla sessione precedente, conteggio.
function getTopicStats(topicClean){
  const hist = state.scores[topicClean];
  if(!hist || hist.length === 0) return null;
  const last = hist[hist.length-1];
  const prev = hist.length > 1 ? hist[hist.length-2] : null;
  const lastPct = last.total > 0 ? Math.round((last.correct/last.total)*100) : 0;
  let avgSum = 0, avgCount = 0;
  hist.forEach(e=>{ if(e.total>0){ avgSum += (e.correct/e.total)*100; avgCount++; } });
  const avgPct = avgCount > 0 ? Math.round(avgSum/avgCount) : 0;
  let trend = null;
  if(prev && prev.total > 0){
    trend = lastPct - Math.round((prev.correct/prev.total)*100);
  }
  return { lastPct, avgPct, trend, count: hist.length };
}

// Raccoglie tutte le materie nell'ambito scelto (solo la categoria in focus, o tutte e 5),
// divise tra "già testate" (ordinate dalla più debole) e "mai testate".
function buildTopicAnalysis(){
  const scopeCats = state.focusMode
    ? [state.focusMode]
    : ['comune','pecspre','pecsscritto','dtd2','informatico'];
  const tested = [];
  const untested = [];
  scopeCats.forEach(cat=>{
    const cd = CATS[cat];
    cd.topics.forEach(t=>{
      const topicClean = computeModeInfo(t, cd).topicClean;
      const stats = getTopicStats(topicClean);
      if(stats){
        tested.push({ cat, catTag: cd.tag, catColor: cd.color, topicClean, mastered: isMastered(topicClean), ...stats });
      } else {
        untested.push({ cat, catTag: cd.tag, catColor: cd.color, topicClean });
      }
    });
  });
  tested.sort((a,b)=> a.avgPct - b.avgPct);
  return { tested, untested };
}


function shuffleOptions(q){
  const order = q.o.map((opt, i) => ({opt, i}));
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return {
    ...q,
    o: order.map(x => x.opt),
    a: order.findIndex(x => x.i === q.a)
  };
}

function startQuiz(topicKey){
  const bank = QUESTION_BANK[topicKey];
  if(!bank) return;
  const stats = (state.quizStats && state.quizStats[topicKey]) || {};
  // ordina le domande mettendo prima quelle sbagliate più spesso in passato (ripasso mirato)
  // e rimescola l'ordine delle opzioni ad ogni tentativo, per non far memorizzare la posizione
  const questions = bank.map((q,i)=>({...q, _id:i}))
    .sort((a,b)=>{
      const wa = (stats[a._id] && stats[a._id].wrong) || 0;
      const wb = (stats[b._id] && stats[b._id].wrong) || 0;
      return wb - wa;
    })
    .map(q => ({...shuffleOptions(q), _id: q._id}));
  activeQuiz = { topic: topicKey, questions, idx:0, correct:0, selected:null, answered:false, finished:false };
  render();
}
function selectQuizAnswer(i){
  if(!activeQuiz || activeQuiz.answered) return;
  activeQuiz.selected = i;
  activeQuiz.answered = true;
  const q = activeQuiz.questions[activeQuiz.idx];
  if(!state.quizStats) state.quizStats = {};
  if(!state.quizStats[activeQuiz.topic]) state.quizStats[activeQuiz.topic] = {};
  const s = state.quizStats[activeQuiz.topic][q._id] || {wrong:0, seen:0};
  s.seen++;
  if(i === q.a) activeQuiz.correct++;
  else s.wrong++;
  state.quizStats[activeQuiz.topic][q._id] = s;
  render();
}
function nextQuizQuestion(){
  if(!activeQuiz) return;
  if(activeQuiz.idx + 1 < activeQuiz.questions.length){
    activeQuiz.idx++;
    activeQuiz.selected = null;
    activeQuiz.answered = false;
  } else {
    activeQuiz.finished = true;
  }
  render();
}
async function saveQuizResult(){
  if(!activeQuiz) return;
  const key = activeQuiz.topic;
  if(!state.scores[key]) state.scores[key] = [];
  state.scores[key].push({ ts: Date.now(), correct: activeQuiz.correct, total: activeQuiz.questions.length });
  await saveState();
  activeQuiz = null;
  render();
}
async function cancelQuiz(){
  activeQuiz = null;
  await saveState(); // salva comunque le statistiche di ripasso già accumulate
  render();
}
function toggleHistoryExpand(topicClean){

  else expandedHistory.add(topicClean);

}

async function saveManualScore(topicKey, cat){

  if(!cEl || !tEl) return;

}

async function loadState(){
  // prima carica la cache locale così l'interfaccia non resta vuota mentre aspetta la rete
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_state?id=eq.${USER_ID}&select=state`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if(res.ok){
      const rows = await res.json();
      if(rows && rows[0] && rows[0].state){
        state = Object.assign(state, rows[0].state);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    }
  }catch(e){
    // niente rete o Supabase non raggiungibile: si resta con la cache locale già caricata sopra
    console.error('Sync da Supabase non riuscita, uso la copia locale', e);
  }

  migrateOldPecsCategory();
}

// Chi aveva progressi salvati con la vecchia categoria unica "pecs" (prima della divisione in
// Preselezione/Scritto): sposta l'indice della coda su "pecspre" (dove si trovava), senza
// perdere nulla — punteggi e cronologia restano intatti perché sono legati al nome della
// materia, non alla categoria.
function migrateOldPecsCategory(){
  if(state.indices && state.indices.pecs !== undefined){
    if(state.indices.pecspre === undefined) state.indices.pecspre = state.indices.pecs;
    if(state.indices.pecsscritto === undefined) state.indices.pecsscritto = 0;
    delete state.indices.pecs;
  }
  if(state.indices && state.indices.pecspre === undefined) state.indices.pecspre = 0;
  if(state.indices && state.indices.pecsscritto === undefined) state.indices.pecsscritto = 0;
  if(state.focusMode === 'pecs') state.focusMode = 'pecspre';

  // Migro anche lo storico: sessioni già completate con la vecchia categoria unica "pecs"
  // devono puntare a "pecspre", altrimenti il tracker va in errore cercando una categoria
  // che non esiste più (mostrando "Caricamento pratiche…" bloccato per sempre).
  if(state.log){
    Object.keys(state.log).forEach(k=>{
      if(state.log[k] && state.log[k].cat === 'pecs') state.log[k].cat = 'pecspre';
    });
  }
  if(state.bonusLog){
    Object.keys(state.bonusLog).forEach(dKey=>{
      const dayEntry = state.bonusLog[dKey];
      if(dayEntry && dayEntry.pecs !== undefined){
        dayEntry.pecspre = dayEntry.pecs;
        delete dayEntry.pecs;
      }
    });
  }
  if(state.customLog){
    Object.keys(state.customLog).forEach(dKey=>{
      (state.customLog[dKey] || []).forEach(entry=>{
        if(entry && entry.cat === 'pecs') entry.cat = 'pecspre';
      });
    });
  }
}

async function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); // cache locale immediata
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tracker_state`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{ id: USER_ID, state: state, updated_at: new Date().toISOString() }])
    });
  }catch(e){
    console.error('Salvataggio su Supabase non riuscito, resta salvato solo in locale', e);
  }
}

    </div>`;
  } else {
    const subText = isStreakMilestone
      ? getMilestoneMessage(streak)
      : (nextMilestone
          ? `${nextMilestone - streak} giorn${(nextMilestone-streak)===1?'o':'i'} al prossimo traguardo (${nextMilestone})`
          : 'Traguardo record personale — nessun limite superiore in vista.');
    streakHeroHtml = `
    <div class="streak-hero tier-${streakTier} ${isStreakMilestone?'milestone':''}">
      <div class="streak-flame">🔥</div>
      <div class="streak-main">
        <div class="streak-title">${streak} giorn${streak===1?'o':'i'} di fila</div>
        <div class="streak-sub">${subText}</div>
      </div>
      ${isStreakMilestone ? `<div class="streak-celebrate">🎉</div>` : ''}
    </div>`;
  }

  // --- Riepilogo settimanale: giorni fatti su 7 + media punteggi + bonus fatti nella settimana ---
  const weekMonday = mondayOf(today);
  let weekDaysDone = 0;
  let weekScoreSum = 0, weekScoreCount = 0;
  let weekBonusTotal = 0;
  const weekBonusByCat = {comune:0, pecspre:0, pecsscritto:0, dtd2:0, informatico:0};
  for(let i=0;i<7;i++){
    const d = new Date(weekMonday);
    d.setDate(weekMonday.getDate()+i);
    const dKey = dateKey(d);
    if(state.log[dKey]) weekDaysDone++;
    const bonusEntry = state.bonusLog[dKey] || {};
    Object.keys(bonusEntry).forEach(bc=>{
      weekBonusTotal++;
      weekBonusByCat[bc] = (weekBonusByCat[bc]||0) + 1;
    });
  }
  let topBonusCat = null, topBonusCount = 0;
  Object.entries(weekBonusByCat).forEach(([c,n])=>{
    if(n > topBonusCount){ topBonusCount = n; topBonusCat = c; }
  });
  Object.values(state.scores).forEach(arr=>{
    arr.forEach(s=>{
      const sDate = new Date(s.ts);
      if(sDate >= weekMonday && sDate < new Date(weekMonday.getFullYear(), weekMonday.getMonth(), weekMonday.getDate()+7)){
        if(s.total>0){ weekScoreSum += (s.correct/s.total)*100; weekScoreCount++; }
      }
    });
  });
  const weekAvgScore = weekScoreCount>0 ? Math.round(weekScoreSum/weekScoreCount) : null;

  const monthCells = monthGridCells(calendarViewDate);
  const isCurrentMonthView = calendarViewDate.getFullYear()===today.getFullYear() && calendarViewDate.getMonth()===today.getMonth();
  let monthHtml = '';
  ['L','M','M','G','V','S','D'].forEach(l=> monthHtml += `<div class="month-dow">${l}</div>`);
  monthCells.forEach(d=>{
    if(!d){ monthHtml += `<div class="month-cell empty"></div>`; return; }
    const dKey = dateKey(d);
    const entry = state.log[dKey];
    const bonusEntry = state.bonusLog[dKey] || {};
    const bonusCats = Object.keys(bonusEntry);
    const customEntries = state.customLog[dKey] || [];
    const isToday = dKey === key;
    let dotsHtml = '';
    if(entry) dotsHtml += `<span class="month-dot" style="background:${CATS[entry.cat] ? CATS[entry.cat].color : 'var(--ink-soft)'}"></span>`;
    bonusCats.forEach(bc=>{
      dotsHtml += `<span class="month-dot month-dot-bonus" style="background:${CATS[bc] ? CATS[bc].color : 'var(--ink-soft)'}"></span>`;
    });
    customEntries.forEach(ce=>{
      dotsHtml += `<span class="month-dot month-dot-custom" style="background:${CATS[ce.cat] ? CATS[ce.cat].color : 'var(--ink-soft)'}"></span>`;
    });
    monthHtml += `<div class="month-cell clickable ${isToday?'today':''} ${dKey===selectedCalendarDay?'selected':''}" data-date="${dKey}">
      <span class="month-daynum">${d.getDate()}</span>
      <span class="month-dots">${dotsHtml}</span>
    </div>`;
  });

  // --- Dettaglio del giorno selezionato nel calendario (se presente) ---
  let dayDetailHtml = '';
  if (selectedCalendarDay){
    const dKey = selectedCalendarDay;
    const dDate = new Date(dKey + 'T00:00:00');
    const dLabel = dDate.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

    const mainEntry = state.log[dKey];
    const bonusEntry = state.bonusLog[dKey] || {};
    const customEntries = state.customLog[dKey] || [];

    let itemsHtml = '';
    if (mainEntry){
      itemsHtml += `<div class="day-detail-row"><span class="day-detail-tag" style="background:${CATS[mainEntry.cat]?.color || 'var(--ink-soft)'}">${CATS[mainEntry.cat]?.tag || mainEntry.cat}</span> Sessione principale — ${mainEntry.topic || '(materia non registrata, dato storico)'}</div>`;
    }
    Object.entries(bonusEntry).forEach(([bc, val])=>{
      const t = (val && typeof val === 'object') ? val.topic : null;
      itemsHtml += `<div class="day-detail-row"><span class="day-detail-tag" style="background:${CATS[bc]?.color || 'var(--ink-soft)'}">${CATS[bc]?.tag || bc}</span> Bonus — ${t || '(materia non registrata, dato storico)'}</div>`;
    });
    customEntries.forEach(ce=>{
      itemsHtml += `<div class="day-detail-row"><span class="day-detail-tag" style="background:${CATS[ce.cat]?.color || 'var(--ink-soft)'}">${CATS[ce.cat]?.tag || ce.cat}</span> Custom — ${ce.topicClean}${ce.source ? ` (${ce.source})` : ''}</div>`;
    });

    // Tutti i punteggi salvati con data uguale a questo giorno, su qualunque materia
    const dayScores = [];
    Object.entries(state.scores).forEach(([topic, arr])=>{
      arr.forEach(e=>{
        if(dateKey(new Date(e.ts)) === dKey) dayScores.push({ topic, correct: e.correct, total: e.total });
      });
    });
    const totalQuestions = dayScores.reduce((s,e)=>s+e.total,0);
    const totalCorrect = dayScores.reduce((s,e)=>s+e.correct,0);

    let scoresHtml = '';
    if (dayScores.length){
      scoresHtml = `<div class="day-detail-scores-title">Quiz fatti quel giorno (${totalQuestions} domande, ${totalCorrect} corrette):</div>` +
        dayScores.map(e=>`<div class="day-detail-row">${e.topic} — ${e.correct}/${e.total}</div>`).join('');
    }

    dayDetailHtml = `
      <div class="day-detail">
        <div class="day-detail-title">${dLabel}</div>
        ${itemsHtml || '<div class="day-detail-empty">Nessuna sessione registrata questo giorno.</div>'}
        ${scoresHtml}
      </div>`;
  }

  // --- Barra di controllo modalità focus ---
  const focusAccent = state.focusMode ? CATS[state.focusMode].color : null;
  let focusBarHtml = '';
  if (state.focusMode){
    const fc = CATS[state.focusMode];
    focusBarHtml = `<div class="focus-bar focus-active">
      <span class="focus-label" style="color:${fc.color}">🎯 Focus: ${fc.label}</span>
      <button class="reset-link focus-reset-btn" id="focusResetBtn">torna alla rotazione automatica</button>
    </div>`;
  } else {
    focusBarHtml = `<div class="focus-bar">
      <span class="focus-label">🔄 Rotazione automatica attiva</span>
      <span class="focus-btns">
        ${['comune','pecspre','pecsscritto','dtd2','informatico'].map(c=>`<button class="focus-choice-btn" data-focus="${c}" style="border-color:${CATS[c].color}; color:${CATS[c].color}">${CATS[c].tag}</button>`).join('')}
      </span>
    </div>`;
  }

  document.getElementById('sheet').style.setProperty('--focus-accent', focusAccent || 'var(--ink)');
  document.getElementById('sheet').innerHTML = `
    <div class="header">
      <div>
        <h1>SbancaDati</h1>
        <div class="sub">Posto Fisso · 3 concorsi attivi · 30–60 min al giorno</div>
      </div>
      <div class="protocollo">
        PROT. N. ${key.replace(/-/g,'/')}<br>
        ${DAY_NAMES[today.getDay()]}
      </div>
    </div>

    ${streakHeroHtml}

    <div class="week-summary">
      ${weekAvgScore!==null ? `Media punteggi questa settimana: <b>${weekAvgScore}%</b>` : 'Nessun punteggio salvato ancora questa settimana'}
    </div>

    <div class="legend">
      <span><span class="dot" style="background:${CATS.comune.color}"></span>Comune</span>
      <span><span class="dot" style="background:${CATS.pecspre.color}"></span>PECS Presel.</span>
      <span><span class="dot" style="background:${CATS.pecsscritto.color}"></span>PECS Scritto</span>
      <span><span class="dot" style="background:${CATS.dtd2.color}"></span>DTD2</span>
      <span><span class="dot" style="background:${CATS.informatico.color}"></span>Informatico (backup)</span>
    </div>

    ${focusBarHtml}
    ${focusPriorityHtml}

    <div class="hero">
      <div class="eyebrow">Sessione di oggi</div>
      ${mainCardHtml}
      ${bonusSectionHtml}
      ${customSectionHtml}
    </div>

    <div class="week">
      <div class="eyebrow">Settimana in corso</div>
      <div class="week-grid">${weekHtml}</div>
    </div>

    <div class="month">
      <div class="month-header">
        <button class="nav-btn" id="prevMonthBtn">‹</button>
        <span class="eyebrow month-title">${MONTH_NAMES[calendarViewDate.getMonth()]} ${calendarViewDate.getFullYear()}${isCurrentMonthView ? '' : ' <a href=\"#\" id=\"backTodayLink\" class=\"back-today\">torna a oggi</a>'}</span>
        <button class="nav-btn" id="nextMonthBtn">›</button>
      </div>
      <div class="month-grid">${monthHtml}</div>
      ${dayDetailHtml}
    </div>

    <div class="progress">
      <div class="eyebrow">Avanzamento pratiche</div>
      ${progressHtml}
    </div>

    ${analysisSectionHtml}

    <div class="footer">
      Sabato si alterna tra PECS Preselezione e DTD2 (simulazione quiz), la domenica è dedicata al backup Assistente Informatico o al riposo.
      Per le simulazioni usa il simulatore quiz su <a href="https://www.concorsando.it" target="_blank" rel="noopener">Concorsando.it</a>.
      <br><br>
      ${(typeof Notification !== 'undefined' && Notification.permission === 'granted')
        ? '<span class="reminder-on">🔔 Promemoria attivo</span> ·'
        : '<button class="reset-link" id="reminderBtn">🔔 attiva promemoria notifiche</button> ·'}
      <button class="reset-link" id="exportBtn">esporta backup</button> ·
      <button class="reset-link" id="importBtn">importa backup</button> ·
      <button class="reset-link" id="resetBtn">reimposta tutti i progressi</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  `;

  document.querySelectorAll('.done-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const btnCat = btn.dataset.cat;
      const isBonus = btn.dataset.bonus === '1';
      if(isBonus) toggleBonusDone(btnCat); else toggleDone();
    });
  });
  document.getElementById('resetBtn').addEventListener('click', resetProgress);
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importBackup);

  document.querySelectorAll('.start-quiz-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startQuiz(btn.dataset.topic));
  });

  document.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click', ()=> selectQuizAnswer(parseInt(btn.dataset.i,10)));
  });
  const quizNextBtnEl = document.getElementById('quizNextBtn');
  if(quizNextBtnEl) quizNextBtnEl.addEventListener('click', nextQuizQuestion);
  const quizSaveBtnEl = document.getElementById('quizSaveBtn');
  if(quizSaveBtnEl) quizSaveBtnEl.addEventListener('click', saveQuizResult);
  const quizCancelBtnEl = document.getElementById('quizCancelBtn');
  if(quizCancelBtnEl) quizCancelBtnEl.addEventListener('click', cancelQuiz);

  document.querySelectorAll('.save-score-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> saveManualScore(btn.dataset.topic, btn.dataset.cat));
  });

  const saveCustomBtnEl = document.getElementById('saveCustomBtn');
  if(saveCustomBtnEl) saveCustomBtnEl.addEventListener('click', saveCustomSession);

  document.querySelectorAll('.history-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleHistoryExpand(btn.dataset.topic));
  });

  const toggleAnalysisBtnEl = document.getElementById('toggleAnalysisBtn');
  if(toggleAnalysisBtnEl) toggleAnalysisBtnEl.addEventListener('click', ()=>{
    analysisExpanded = !analysisExpanded;
    render();
  });

  document.querySelectorAll('.month-cell.clickable').forEach(cellEl=>{
    cellEl.addEventListener('click', ()=>{
      const d = cellEl.dataset.date;
      selectedCalendarDay = (selectedCalendarDay === d) ? null : d;
      render();
    });
  });

  document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()-1, 1);
    selectedCalendarDay = null;
    render();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 1);
    selectedCalendarDay = null;
    render();
  });
  const backTodayEl = document.getElementById('backTodayLink');
  if(backTodayEl) backTodayEl.addEventListener('click', (e)=>{
    e.preventDefault();
    calendarViewDate = new Date();
    selectedCalendarDay = null;
    render();
  });
  const reminderBtnEl = document.getElementById('reminderBtn');
  if(reminderBtnEl) reminderBtnEl.addEventListener('click', requestReminder);

  document.querySelectorAll('.focus-choice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> setFocusMode(btn.dataset.focus));
  });
  const focusResetBtnEl = document.getElementById('focusResetBtn');
  if(focusResetBtnEl) focusResetBtnEl.addEventListener('click', ()=> setFocusMode(null));
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-piano-studio-' + dateKey(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed.indices || !parsed.log){ throw new Error('formato non valido'); }
    state = parsed;
    if(!state.scores) state.scores = {};
    if(!state.quizStats) state.quizStats = {};
    if(!state.bonusLog) state.bonusLog = {};
    if(!state.customLog) state.customLog = {};
    if(state.focusMode === undefined) state.focusMode = null;
    await saveState();
    render();
    alert('Backup importato correttamente.');
  }catch(e){
    alert('File non valido: ' + e.message);
  }
  ev.target.value = '';
}

async function toggleDone(){
  const today = new Date();
  const key = dateKey(today);
  if(state.log[key]){
    const storedCat = state.log[key].cat;
    delete state.log[key];
    state.indices[storedCat] = Math.max(0, (state.indices[storedCat]||0) - 1);
  } else {
    const cat = effectiveDayCategory(today);
    state.log[key] = { cat, topic: getCurrentTopicClean(cat) };
    state.indices[cat] = (state.indices[cat]||0) + 1;
  }
  await saveState();
  render();
  if(state.log[key]){
    const stampEl = document.getElementById('stamp');
    if(stampEl){
      stampEl.classList.remove('show');
      void stampEl.offsetWidth;
      stampEl.classList.add('show');
    }
  }
}

async function toggleBonusDone(cat){
  const key = dateKey(new Date());
  if(!state.bonusLog[key]) state.bonusLog[key] = {};
  if(state.bonusLog[key][cat]){
    delete state.bonusLog[key][cat];
    state.indices[cat] = Math.max(0, (state.indices[cat]||0) - 1);
  } else {
    state.bonusLog[key][cat] = { topic: getCurrentTopicClean(cat) };
    state.indices[cat] = (state.indices[cat]||0) + 1;
  }
  await saveState();
  render();
}

async function saveCustomSession(){
  const select = document.getElementById('customTopicSelect');
  const val = select.value;
  if(!val){
    alert('Scegli prima una materia dal menu.');
    return;
  }
  const [cat, topicClean] = val.split('|||');

  const cEl = document.getElementById('customCorrect');
  const tEl = document.getElementById('customTotal');
  const sourceEl = document.getElementById('customSource');
  const correctRaw = cEl.value.trim();
  const totalRaw = tEl.value.trim();
  const source = sourceEl.value || null;

  let scoreSaved = false;
  if(correctRaw !== '' || totalRaw !== ''){
    const correct = parseInt(correctRaw, 10);
    const total = parseInt(totalRaw, 10);
    if(isNaN(correct) || isNaN(total) || total <= 0 || correct < 0 || correct > total){
      alert('Il punteggio inserito non è valido (corrette non può superare il totale). Lascia entrambi i campi vuoti se non vuoi registrare un punteggio.');
      return;
    }
    if(!state.scores[topicClean]) state.scores[topicClean] = [];
    state.scores[topicClean].push({ ts: Date.now(), correct, total });
    scoreSaved = true;
  }

  const key = dateKey(new Date());
  if(!state.customLog[key]) state.customLog[key] = [];
  state.customLog[key].push({ cat, topicClean, source, ts: Date.now() });

  await saveState();
  render();
  alert(`Sessione registrata su "${topicClean}"${scoreSaved ? ' con punteggio salvato' : ''}. Non tocca lo streak né la coda degli argomenti.`);
}

async function resetProgress(){
  if(!confirm('Reimpostare tutti i progressi salvati? Questa azione non si può annullare.')) return;
  state = { indices:{comune:0,pecspre:0,pecsscritto:0,dtd2:0,informatico:0}, log:{}, scores:{}, quizStats:{}, bonusLog:{}, customLog:{}, focusMode:null };
  await saveState();
  render();
}

function requestReminder(){
  if(!('Notification' in window)){
    alert('Il tuo browser non supporta le notifiche.');
    return;
  }
  Notification.requestPermission().then(perm=>{
    if(perm === 'granted'){
      new Notification('Promemoria attivato ✓', { body: 'Da ora, ogni volta che apri questa pagina, ti ricorderò se non hai ancora studiato oggi.' });
    }
    render();
  });
}

function maybeShowReminder(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const todayKey = dateKey(new Date());
  if(!state.log[todayKey]){
    new Notification('Non hai ancora studiato oggi 🔥', { body: 'Bastano 30-60 minuti — apri la sessione di oggi nel tracker.' });
  }
}

(async function init(){
  await loadState();
  render();
  maybeShowReminder();
})();
</script>
